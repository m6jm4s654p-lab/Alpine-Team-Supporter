<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c2c"><title>Alpine Team Supporter</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>
:root{--bg:#08150f;--panel:#10251a;--panel2:#163324;--line:#2b4c39;--text:#effaf3;--muted:#91ad9b;--accent:#23c55e;--accent2:#5de38c;--danger:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#08150f,#0d2116 45%,#08150f);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.app{max-width:900px;margin:auto;padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom))}.head{position:sticky;top:0;z-index:5;background:rgba(8,21,15,.92);backdrop-filter:blur(14px);padding:14px 0 10px;border-bottom:1px solid rgba(255,255,255,.06)}.brand{display:flex;justify-content:space-between;gap:12px;align-items:end}.brand h1{font-size:22px;margin:0;letter-spacing:.02em}.brand small{color:var(--muted);font-weight:700}.team{font-size:12px;color:var(--accent);margin-top:4px;font-weight:800}.update{display:flex;gap:8px;align-items:center;margin-top:10px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#237346,#17633b);border-color:#409665}.update-info{font-size:11px;color:var(--muted)}input[type=file]{display:none}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.menu button{min-height:68px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-weight:800;font-size:13px}.menu button.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#123522}.panel{display:none}.panel.active{display:block}.card{background:rgba(16,37,26,.95);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.card h2{font-size:17px;margin:0 0 10px}.muted{color:var(--muted)}.empty{text-align:center;padding:36px 16px;color:var(--muted)}.row{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.badge{font-size:11px;border:1px solid #376b4b;border-radius:999px;padding:3px 8px;color:#c8f4d7}.schedule-item,.athlete-item,.rank-item,.venue-item,.race-item{padding:11px 0;border-top:1px solid rgba(255,255,255,.07)}.schedule-item:first-child,.athlete-item:first-child,.rank-item:first-child,.venue-item:first-child,.race-item:first-child{border-top:0}.date{font-weight:900;color:#bdf2cf}.title{font-weight:900}.meta{font-size:12px;color:var(--muted);margin-top:4px}.points{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.point{background:#0a1c12;border-radius:9px;padding:6px;text-align:center;font-size:11px}.point b{display:block;font-size:14px;color:#fff}.rank-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rank-col h3{font-size:13px;margin:4px 0 8px;color:#cef5db}.rank-item{font-size:12px}.rank-item b{font-size:13px}.venue-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.link{display:inline-block;text-decoration:none;color:#e0f8e8;background:#153b27;border:1px solid #326848;padding:7px 10px;border-radius:9px;font-size:12px;font-weight:800}.weather-now{font-size:28px;font-weight:900}.weather-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.weather-box{background:#0b1f14;border-radius:12px;padding:10px}.notice{border:1px solid #356348;background:#0e2a1b;border-radius:12px;padding:12px;font-size:12px;color:#bddbc7}.footer{text-align:center;color:#627f6b;font-size:10px;margin-top:24px}@media(max-width:600px){.menu{grid-template-columns:repeat(2,1fr)}.rank-cols{grid-template-columns:1fr}.brand h1{font-size:19px}.update{align-items:flex-start;flex-direction:column}.btn{width:100%}}
</style></head><body><div class="app"><header class="head"><div class="brand"><div><h1>Alpine Team Supporter</h1><div id="teamName" class="team">データ未取込</div></div><small>v1.0.1</small></div><div class="update"><label class="btn primary">データ更新ファイルを取り込む<input id="fileInput" type="file" accept=".atsdata,.json,application/json"></label><div id="updatedAt" class="update-info">LINEなどで受け取ったデータ更新ファイルを取り込んでください。</div></div></header>
<nav class="menu"><button data-tab="schedule" class="active">予定表</button><button data-tab="athletes">選手一覧</button><button data-tab="ranking">チームランキング</button><button data-tab="venues">会場情報</button><button data-tab="weather">天気・積雪</button><button data-tab="race">レース速報</button></nav>
<main><section id="schedule" class="panel active"></section><section id="athletes" class="panel"></section><section id="ranking" class="panel"></section><section id="venues" class="panel"></section><section id="weather" class="panel"></section><section id="race" class="panel"></section></main><div class="footer">閲覧専用 / データはこの端末内に保存されます</div></div>
<script>
const STORE='alpine_team_supporter_data_v1';const META='alpine_team_supporter_meta_v1';let db=load();function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(d){if(!d)return'—';const x=new Date(d+'T00:00:00');return isNaN(x)?esc(d):`${x.getMonth()+1}/${x.getDate()}`};function load(){try{return JSON.parse(localStorage.getItem(STORE)||'null')||{team:{},athletes:[],schedules:[],events:[]}}catch{return{team:{},athletes:[],schedules:[],events:[]}}}function save(data,meta){localStorage.setItem(STORE,JSON.stringify(data));localStorage.setItem(META,JSON.stringify(meta));db=data}function norm(raw){let o=raw;if(raw?.schema==='alpine-team-supporter-update-v1'&&raw.data)o=raw.data;if(!o||typeof o!=='object')throw new Error('データ形式が正しくありません');return{team:o.team&&typeof o.team==='object'?o.team:{},athletes:Array.isArray(o.athletes)?o.athletes:[],schedules:Array.isArray(o.schedules)?o.schedules:[],events:Array.isArray(o.events)?o.events:[]}}
async function importFile(file){if(!file)return;if(file.size>8*1024*1024)throw new Error('ファイルサイズが大きすぎます');const raw=JSON.parse(await file.text());const data=norm(raw);const meta={updatedAt:new Date().toISOString(),sourceExportedAt:raw.exportedAt||'',filename:file.name||''};save(data,meta);renderAll();alert('データを更新しました。')}
document.getElementById('fileInput').addEventListener('change',async e=>{try{await importFile(e.target.files?.[0])}catch(err){alert('データ更新ファイルを取り込めませんでした。\n'+err.message)}finally{e.target.value=''}});
if('launchQueue' in window){launchQueue.setConsumer(async params=>{const h=params.files?.[0];if(!h)return;try{await importFile(await h.getFile())}catch(e){alert('受信したデータ更新ファイルを開けませんでした。')}})}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));if(b.dataset.tab==='weather')renderWeather()});
function renderHeader(){teamName.textContent=db.team?.name||'チーム名未設定';let m={};try{m=JSON.parse(localStorage.getItem(META)||'{}')}catch{};updatedAt.textContent=m.updatedAt?`データ更新：${new Date(m.updatedAt).toLocaleString('ja-JP')}`:'LINEなどで受け取ったデータ更新ファイルを取り込んでください。'}
function mergedSchedule(){const s=(db.schedules||[]).map(x=>({date:x.date,end:x.date,title:x.title||x.type||'予定',place:x.place||'',kind:x.type||'予定',target:x.target||'',note:x.note||''}));const e=(db.events||[]).map(x=>({date:x.start,end:x.end,title:x.title||'大会',place:x.place||'',kind:x.disc||'大会',target:'',note:x.note||''}));return [...s,...e].filter(x=>x.date).sort((a,b)=>String(a.date).localeCompare(String(b.date)))}
function renderSchedule(){const all=mergedSchedule();schedule.innerHTML=`<div class="card"><h2>予定表</h2>${all.length?all.map(x=>`<div class="schedule-item"><div class="row"><span class="date">${fmt(x.date)}${x.end&&x.end!==x.date?'〜'+fmt(x.end):''}</span><span class="badge">${esc(x.kind)}</span></div><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.place||'会場未設定')}${x.target?' / '+esc(x.target):''}${x.note?' / '+esc(x.note):''}</div></div>`).join(''):'<div class="empty">予定データがありません</div>'}</div>`}
function age(b){if(!b)return null;const d=new Date(b+'T00:00:00'),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a>=0?a:null}function renderAthletes(){const arr=[...(db.athletes||[])].sort((a,b)=>String(a.birth||'9999').localeCompare(String(b.birth||'9999')));athletes.innerHTML=`<div class="card"><h2>選手一覧</h2>${arr.length?arr.map(a=>`<div class="athlete-item"><div class="row"><div class="title">${esc(a.name||'氏名未設定')}</div><span class="badge">${age(a.birth)==null?'年齢—':age(a.birth)+'歳'}</span></div><div class="meta">SAJ No. ${esc(a.saj||'—')} / ${esc(a.school||'')}${a.grade?' '+esc(a.grade):''}</div><div class="points"><div class="point">SL<b>${a.sl??'—'}</b></div><div class="point">GS<b>${a.gs??'—'}</b></div><div class="point">SG<b>${a.sg??'—'}</b></div></div></div>`).join(''):'<div class="empty">選手データがありません</div>'}</div>`}
function valid(v){return v!==null&&v!==''&&Number.isFinite(Number(v))}function rankList(d,sex){const k=d.toLowerCase();return (db.athletes||[]).filter(a=>(a.sex||'')===sex).sort((a,b)=>{const av=valid(a[k])?Number(a[k]):999999,bv=valid(b[k])?Number(b[k]):999999;return av-bv||String(a.name||'').localeCompare(String(b.name||''),'ja')})}function rankCol(d,sex){let r=0;return `<div class="rank-col"><h3>${sex==='男'?'男子':'女子'} ${d}</h3>${rankList(d,sex).map(a=>{const k=d.toLowerCase(),ok=valid(a[k]);return `<div class="rank-item"><b>${ok?++r+'位':'—'} ${esc(a.name||'')}</b><span style="float:right">${ok?esc(a[k]):'—'}</span></div>`}).join('')||'<div class="muted">登録なし</div>'}</div>`}function renderRanking(){ranking.innerHTML=`<div class="card"><h2>チームランキング</h2><div class="rank-cols">${['SL','GS','SG'].map(d=>rankCol(d,'男')).join('')}</div></div><div class="card"><div class="rank-cols">${['SL','GS','SG'].map(d=>rankCol(d,'女')).join('')}</div></div>`}
function venuesData(){const m=new Map();(db.events||[]).forEach(e=>{const p=String(e.place||'').trim();if(!p)return;if(!m.has(p))m.set(p,[]);m.get(p).push(e)});return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ja'))}function mapsUrl(p){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p)}function renderVenues(){const v=venuesData();venues.innerHTML=`<div class="card"><h2>会場情報</h2>${v.length?v.map(([p,ev])=>`<div class="venue-item"><div class="title">${esc(p)}</div><div class="meta">${ev.map(x=>esc(x.title||'大会')).join(' / ')}</div><div class="venue-actions"><a class="link" target="_blank" rel="noopener" href="${mapsUrl(p)}">地図を開く</a></div></div>`).join(''):'<div class="empty">会場データがありません</div>'}</div>`}
function nextVenue(){const today=new Date().toISOString().slice(0,10);const e=(db.events||[]).filter(x=>x.place&&(!x.end||x.end>=today)).sort((a,b)=>String(a.start||'9999').localeCompare(String(b.start||'9999')))[0];return e?.place||db.team?.mainSkiArea||''}async function renderWeather(){const p=nextVenue();if(!p){weather.innerHTML='<div class="card"><h2>天気・積雪</h2><div class="empty">会場情報がありません</div></div>';return}weather.innerHTML=`<div class="card"><h2>天気・積雪</h2><div class="muted">${esc(p)} の情報を取得中…</div></div>`;try{const g=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=ja&format=json&name='+encodeURIComponent(p)).then(r=>r.json());const q=g.results?.[0];if(!q)throw new Error('位置情報を取得できません');const u=`https://api.open-meteo.com/v1/forecast?latitude=${q.latitude}&longitude=${q.longitude}&current=temperature_2m,weather_code,snow_depth,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,snowfall_sum&timezone=Asia%2FTokyo&forecast_days=5`;const w=await fetch(u).then(r=>r.json());const c=w.current||{},d=w.daily||{};weather.innerHTML=`<div class="card"><h2>天気・積雪</h2><div class="title">${esc(p)}</div><div class="weather-now">${c.temperature_2m??'—'}℃</div><div class="meta">積雪深 ${c.snow_depth==null?'—':Math.round(c.snow_depth*100)+'cm'} / 風 ${c.wind_speed_10m??'—'} km/h</div></div><div class="card"><div class="weather-grid">${(d.time||[]).map((x,i)=>`<div class="weather-box"><b>${fmt(x)}</b><div>${d.temperature_2m_min?.[i]??'—'}〜${d.temperature_2m_max?.[i]??'—'}℃</div><div class="muted">降雪 ${d.snowfall_sum?.[i]??'—'}cm</div></div>`).join('')}</div></div>`}catch(e){weather.innerHTML=`<div class="card"><h2>天気・積雪</h2><div class="notice">${esc(p)} の天気情報を取得できませんでした。通信状態または会場名を確認してください。</div></div>`}}
function renderRace(){const today=new Date().toISOString().slice(0,10);const ev=(db.events||[]).filter(e=>(e.end||e.start||'')>=today).sort((a,b)=>String(a.start||'').localeCompare(String(b.start||'')));race.innerHTML=`<div class="card"><h2>レース速報</h2><div class="venue-actions"><a class="link" target="_blank" rel="noopener" href="https://seikosportslink.com/seiko/ssl/sportslink?a=portal&s=as">SEIKO SPORTS LINK</a><a class="link" target="_blank" rel="noopener" href="http://116.58.169.162/alge/">ALGE Live</a></div><div class="notice" style="margin-top:12px">速報サイトは外部サイトを開きます。大会ごとの速報URLが更新データに含まれる場合は、今後ここへ自動表示できます。</div>${ev.map(e=>`<div class="race-item"><div class="row"><div class="title">${esc(e.title||'大会')}</div><span class="badge">${esc(e.disc||'')}</span></div><div class="meta">${fmt(e.start)}${e.end&&e.end!==e.start?'〜'+fmt(e.end):''} / ${esc(e.place||'—')}</div></div>`).join('')||'<div class="empty">今後の大会データがありません</div>'}</div>`}
function renderAll(){renderHeader();renderSchedule();renderAthletes();renderRanking();renderVenues();renderWeather();renderRace()}renderAll();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
