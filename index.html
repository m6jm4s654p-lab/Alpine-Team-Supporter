<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#123c2c"><title>Alpine Team Supporter</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>
:root{--bg:#08150f;--panel:#10251a;--panel2:#163324;--line:#2b4c39;--text:#effaf3;--muted:#91ad9b;--accent:#23c55e;--accent2:#5de38c;--danger:#ff6b6b;--saturday:#61a9ff}*{box-sizing:border-box}html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0;background:linear-gradient(180deg,#08150f,#0d2116 45%,#08150f);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.app{max-width:900px;margin:auto;padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom))}.head{position:relative;background:rgba(8,21,15,.92);backdrop-filter:blur(14px);padding:14px 0 10px;border-bottom:1px solid rgba(255,255,255,.06)}.brand{display:flex;justify-content:space-between;gap:12px;align-items:end}.brand h1{font-size:22px;margin:0;letter-spacing:.02em}.brand small{color:var(--muted);font-weight:700}.team{font-size:24px;color:var(--accent);margin-top:4px;font-weight:800}.update{display:flex;gap:8px;align-items:center;margin-top:10px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#237346,#17633b);border-color:#409665}.update-info{font-size:11px;color:var(--muted)}input[type=file]{display:none}.menu{position:sticky;top:env(safe-area-inset-top);z-index:8;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 -14px 14px;padding:10px 14px;background:rgba(8,21,15,.96);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}.menu button{min-height:68px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-weight:800;font-size:13px}.menu button.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#123522}.panel{display:none}.panel.active{display:block}.card{background:rgba(16,37,26,.95);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.card h2{font-size:17px;margin:0 0 10px}.muted{color:var(--muted)}.empty{text-align:center;padding:36px 16px;color:var(--muted)}.row{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.badge{font-size:11px;border:1px solid #376b4b;border-radius:999px;padding:3px 8px;color:#c8f4d7}.schedule-item,.athlete-item,.race-item{padding:11px 0;border-top:1px solid rgba(255,255,255,.07)}.schedule-item:first-child,.athlete-item:first-child,.race-item:first-child{border-top:0}.date{font-weight:900;color:#bdf2cf}.title{font-weight:900}.meta{font-size:12px;color:var(--muted);margin-top:4px}.points{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.point{background:#0a1c12;border-radius:9px;padding:6px;text-align:center;font-size:11px}.point b{display:block;font-size:14px;color:#fff}.venue-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.link{display:inline-block;text-decoration:none;color:#e0f8e8;background:#153b27;border:1px solid #326848;padding:7px 10px;border-radius:9px;font-size:12px;font-weight:800}.notice{border:1px solid #356348;background:#0e2a1b;border-radius:12px;padding:12px;font-size:12px;color:#bddbc7}.month-list{display:flex;flex-direction:column;gap:14px;max-height:calc(100dvh - 210px);overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth;padding-right:2px;scrollbar-gutter:stable}.month-calendar{background:#0a1c12;border:1px solid #294936;border-radius:13px;padding:10px;scroll-margin-top:6px}.month-calendar h3{margin:0 0 9px;color:#cef5db;font-size:16px;text-align:center}.weekdays,.calendar-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.weekday{text-align:center;color:var(--muted);font-size:11px;font-weight:800;padding:3px 0}.weekday.sun{color:var(--danger)}.weekday.sat{color:var(--saturday)}.day-cell{min-height:72px;background:#10251a;border:1px solid rgba(255,255,255,.06);border-radius:7px;padding:4px;overflow:hidden}.day-cell.blank{background:transparent;border-color:transparent}.day-number{display:block;font-size:12px;font-weight:900;color:#fff}.day-cell.sun .day-number,.day-cell.holiday .day-number{color:var(--danger)}.day-cell.sat:not(.holiday) .day-number{color:var(--saturday)}.holiday-name{display:block;color:var(--danger);font-size:8px;line-height:1.15;margin-top:1px}.calendar-item{display:block;background:#174d2d;border-left:2px solid var(--accent);border-radius:3px;color:#eafff0;font-size:9px;line-height:1.2;padding:2px 3px;margin-top:3px;word-break:break-word}.calendar-item.competition{background:#f3c487;border-left-color:#e89a3d;color:#3c260f}.athlete-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.national-ranks{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;font-size:10px;color:var(--muted)}.national-ranks span{white-space:nowrap;background:#0a1c12;border:1px solid #376b4b;border-radius:7px;padding:3px 5px}.national-ranks b{color:#fff;font-size:11px}.footer{text-align:center;color:#627f6b;font-size:10px;margin-top:24px}@media(max-width:600px){.menu{grid-template-columns:repeat(2,1fr);padding-top:8px;padding-bottom:8px}.menu button{min-height:52px}.month-list{max-height:calc(100dvh - 185px)}.day-cell{min-height:62px;padding:3px}.day-number{font-size:11px}.calendar-item{font-size:8px;padding:2px}.athlete-head{display:block}.national-ranks{justify-content:flex-start;margin-top:7px}.brand h1{font-size:19px}.update{align-items:flex-start;flex-direction:column}.btn{width:100%}}
html,body{width:100%;height:100%;overflow:hidden}body{min-height:0}.app{height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden}.head,.menu,.footer{flex:0 0 auto}.menu{position:relative;top:auto}main{flex:1 1 auto;min-height:0;overflow:hidden}.panel.active{height:100%;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}#annual.panel.active{overflow:hidden}#annual .card{height:calc(100% - 20px);min-height:0;display:flex;flex-direction:column}#annual .month-list{flex:1 1 auto;min-height:0;max-height:none;-webkit-overflow-scrolling:touch}
</style></head><body><div class="app"><header class="head"><div class="brand"><div><h1>Alpine Team Supporter</h1><div id="teamName" class="team">データ未取込</div></div><small>v1.1.8</small></div><div class="update"><label class="btn primary">データ更新ファイルを取り込む<input id="fileInput" type="file" accept=".txt,.atsdata,.json,text/plain,application/json"></label><div id="updatedAt" class="update-info">LINEなどで受け取ったデータ更新ファイルを取り込んでください。</div></div></header>
<nav class="menu"><button data-tab="annual" class="active">年間スケジュール</button><button data-tab="competitions">大会一覧</button><button data-tab="athletes">選手一覧</button><button data-tab="race">レース速報</button></nav>
<main><section id="annual" class="panel active"></section><section id="competitions" class="panel"></section><section id="athletes" class="panel"></section><section id="race" class="panel"></section></main><div class="footer">閲覧専用 / データはこの端末内に保存されます</div></div>
<script>
for(const type of['gesturestart','gesturechange','gestureend'])document.addEventListener(type,e=>e.preventDefault(),{passive:false});document.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey)e.preventDefault()},{passive:false});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].includes(e.key))e.preventDefault()});
const STORE='alpine_team_supporter_data_v1';const META='alpine_team_supporter_meta_v1';let db=load();function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(d){if(!d)return'—';const x=new Date(d+'T00:00:00');return isNaN(x)?esc(d):`${x.getMonth()+1}/${x.getDate()}`};function load(){try{return JSON.parse(localStorage.getItem(STORE)||'null')||{team:{},athletes:[],schedules:[],events:[]}}catch{return{team:{},athletes:[],schedules:[],events:[]}}}function save(data,meta){localStorage.setItem(STORE,JSON.stringify(data));localStorage.setItem(META,JSON.stringify(meta));db=data}function norm(raw){let o=raw;if(raw?.schema==='alpine-team-supporter-update-v1'&&raw.data)o=raw.data;if(!o||typeof o!=='object')throw new Error('データ形式が正しくありません');return{team:o.team&&typeof o.team==='object'?o.team:{},athletes:Array.isArray(o.athletes)?o.athletes:[],schedules:Array.isArray(o.schedules)?o.schedules:[],events:Array.isArray(o.events)?o.events:[],annualCalendar:o.annualCalendar&&typeof o.annualCalendar==='object'?o.annualCalendar:(o.calendar&&typeof o.calendar==='object'?o.calendar:null),calendar:o.calendar&&typeof o.calendar==='object'?o.calendar:(o.annualCalendar&&typeof o.annualCalendar==='object'?o.annualCalendar:null),nationalRankUpdatedAt:o.nationalRankUpdatedAt||''}}
async function importFile(file){if(!file)return;if(file.size>8*1024*1024)throw new Error('ファイルサイズが大きすぎます');const raw=JSON.parse(await file.text());const data=norm(raw);const meta={updatedAt:new Date().toISOString(),sourceExportedAt:raw.exportedAt||'',filename:file.name||''};save(data,meta);renderAll();alert('データを更新しました。')}
document.getElementById('fileInput').addEventListener('change',async e=>{try{await importFile(e.target.files?.[0])}catch(err){alert('データ更新ファイルを取り込めませんでした。\n'+err.message)}finally{e.target.value=''}});
if('launchQueue' in window){launchQueue.setConsumer(async params=>{const h=params.files?.[0];if(!h)return;try{await importFile(await h.getFile())}catch(e){alert('受信したデータ更新ファイルを開けませんでした。')}})}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});
function renderHeader(){teamName.textContent=db.team?.name||'チーム名未設定';let m={};try{m=JSON.parse(localStorage.getItem(META)||'{}')}catch{};updatedAt.textContent=m.updatedAt?`データ更新：${new Date(m.updatedAt).toLocaleString('ja-JP')}`:'LINEなどで受け取ったデータ更新ファイルを取り込んでください。'}
function mergedSchedule(){const s=(db.schedules||[]).map(x=>({date:x.date,end:x.date,title:x.title||x.type||'予定',place:x.place||'',kind:x.type||'予定',target:x.target||'',note:x.note||'',source:'schedule'}));const e=(db.events||[]).map(x=>({date:x.start,end:x.end,title:x.title||'大会',place:x.place||'',kind:x.disc||'大会',target:'',note:x.note||'',source:'event'}));return [...s,...e].filter(x=>x.date).sort((a,b)=>String(a.date).localeCompare(String(b.date)))}
const holidayCache=new Map();
function annualCalendarData(){return db.annualCalendar||db.calendar||null}
function seasonStartYear(){const c=annualCalendarData();if(Number.isFinite(Number(c?.seasonStartYear)))return Number(c.seasonStartYear);const n=new Date();return n.getMonth()+1>=5?n.getFullYear():n.getFullYear()-1}
function monthSpec(){const y=seasonStartYear();return[5,6,7,8,9,10,11,12].map(m=>({year:y,month:m})).concat([1,2,3,4].map(m=>({year:y+1,month:m})))}
function annualItems(){const out=[],seen=new Set(),norm=v=>String(v??'').trim().replace(/\s+/g,' ').toLowerCase(),add=x=>{if(!x?.date)return;const item={...x,date:String(x.date).slice(0,10)},key=[item.date,norm(item.title||item.kind),norm(item.place)].join('|');if(!seen.has(key)){seen.add(key);out.push(item)}};const c=annualCalendarData(),days=Array.isArray(c?.days)?c.days:[],hasCalendarItems=days.some(d=>Array.isArray(d.items)&&d.items.length);if(hasCalendarItems){for(const d of days){for(const it of(Array.isArray(d.items)?d.items:[]))add({date:d.date,end:d.date,title:it.title||it.type||'予定',place:it.place||'',kind:it.type||'予定',target:it.target||'',note:it.note||'',coach:it.coach||'',source:it.source||''})}}const y=seasonStartYear(),rangeStart=String(c?.rangeStart||`${y}-04-01`).slice(0,10),rangeEnd=String(c?.rangeEnd||`${y+1}-03-31`).slice(0,10);for(const x of mergedSchedule()){const d=String(x.date).slice(0,10);if(!hasCalendarItems||d<rangeStart||d>rangeEnd)add(x)}return out.sort((a,b)=>String(a.date).localeCompare(String(b.date)))}
function isoDate(y,m,d){return`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}function nthMonday(y,m,n){const first=new Date(y,m-1,1).getDay();return 1+((8-first)%7)+7*(n-1)}function equinoxDay(y,spring){return Math.floor((spring?20.8431:23.2488)+.242194*(y-1980)-Math.floor((y-1980)/4))}function holidaysForYear(y){if(holidayCache.has(y))return holidayCache.get(y);const h=new Map(),put=(m,d,n)=>h.set(isoDate(y,m,d),n);put(1,1,'元日');put(1,nthMonday(y,1,2),'成人の日');put(2,11,'建国記念の日');if(y>=2020)put(2,23,'天皇誕生日');put(3,equinoxDay(y,true),'春分の日');put(4,29,'昭和の日');put(5,3,'憲法記念日');put(5,4,'みどりの日');put(5,5,'こどもの日');put(7,nthMonday(y,7,3),'海の日');put(8,11,'山の日');put(9,nthMonday(y,9,3),'敬老の日');put(9,equinoxDay(y,false),'秋分の日');put(10,nthMonday(y,10,2),'スポーツの日');put(11,3,'文化の日');put(11,23,'勤労感謝の日');for(let d=new Date(y,0,2);d.getFullYear()===y;d.setDate(d.getDate()+1)){const k=isoDate(y,d.getMonth()+1,d.getDate()),p=new Date(d),n=new Date(d);p.setDate(p.getDate()-1);n.setDate(n.getDate()+1);const pk=isoDate(p.getFullYear(),p.getMonth()+1,p.getDate()),nk=isoDate(n.getFullYear(),n.getMonth()+1,n.getDate());if(!h.has(k)&&h.has(pk)&&h.has(nk))h.set(k,'国民の休日')}const originals=[...h.keys()];for(const k of originals){const [yy,mm,dd]=k.split('-').map(Number),date=new Date(yy,mm-1,dd);if(date.getDay()!==0)continue;let sub=new Date(date);do{sub.setDate(sub.getDate()+1)}while(h.has(isoDate(sub.getFullYear(),sub.getMonth()+1,sub.getDate())));if(sub.getFullYear()===y)h.set(isoDate(y,sub.getMonth()+1,sub.getDate()),'振替休日')}holidayCache.set(y,h);return h}
function isCompetitionItem(x){const source=String(x?.source||'').toLowerCase(),kind=String(x?.kind||'');return source==='event'||source==='events'||source==='competition'||source==='race'||kind==='大会'}function renderMonth({year,month},all){const first=new Date(year,month-1,1).getDay(),last=new Date(year,month,0).getDate(),holidays=holidaysForYear(year),cells=[];for(let i=0;i<first;i++)cells.push('<div class="day-cell blank"></div>');for(let day=1;day<=last;day++){const key=isoDate(year,month,day),dow=new Date(year,month-1,day).getDay(),holiday=holidays.get(key)||'',items=all.filter(x=>String(x.date).slice(0,10)===key),cls=holiday?'holiday':dow===0?'sun':dow===6?'sat':'';cells.push(`<div class="day-cell ${cls}"><span class="day-number">${day}</span>${holiday?`<span class="holiday-name">${esc(holiday)}</span>`:''}${items.map(x=>`<span class="calendar-item ${isCompetitionItem(x)?'competition':''}">${esc(x.title||x.kind||'予定')}</span>`).join('')}</div>`)}while(cells.length%7)cells.push('<div class="day-cell blank"></div>');return`<section id="month-${year}-${String(month).padStart(2,'0')}" class="month-calendar"><h3>${year}年 ${month}月</h3><div class="weekdays"><div class="weekday sun">日</div><div class="weekday">月</div><div class="weekday">火</div><div class="weekday">水</div><div class="weekday">木</div><div class="weekday">金</div><div class="weekday sat">土</div></div><div class="calendar-days">${cells.join('')}</div></section>`}
function positionAnnualCalendar(){const list=document.getElementById('annualMonthList');if(!list)return;list.scrollTop=0;const n=new Date(),target=document.getElementById(`month-${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`);if(target)requestAnimationFrame(()=>{list.scrollTop=Math.max(0,target.offsetTop-list.offsetTop)})}function renderAnnual(){const all=annualItems();annual.innerHTML=`<div class="card"><div id="annualMonthList" class="month-list">${monthSpec().map(x=>renderMonth(x,all)).join('')}</div></div>`;positionAnnualCalendar()}
function renderCompetitions(){const all=(db.events||[]).map(x=>({date:x.start,end:x.end,title:x.title||'大会',place:x.place||'',kind:x.disc||'大会',note:x.note||''})).filter(x=>x.date).sort((a,b)=>String(a.date).localeCompare(String(b.date)));competitions.innerHTML=`<div class="card"><h2>大会一覧</h2>${all.length?all.map(x=>`<div class="schedule-item"><div class="row"><span class="date">${fmt(x.date)}${x.end&&x.end!==x.date?'〜'+fmt(x.end):''}</span><span class="badge">${esc(x.kind)}</span></div><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.place||'会場未設定')}${x.note?' / '+esc(x.note):''}</div></div>`).join(''):'<div class="empty">大会データがありません</div>'}</div>`}
function age(b){if(!b)return null;const d=new Date(b+'T00:00:00'),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a>=0?a:null}function nationalRank(a,d){const k=d.toLowerCase(),groups=[a.nationalRank,a.nationalRanks,a.nationalRanking,a.sajRank,a.sajRanks,a.sajRanking,a.rank,a.ranks].filter(x=>x&&typeof x==='object');const direct=[a[`${k}NationalRank`],a[`nationalRank${d}`],a[`${k}Rank`],a[`${d}Rank`],a[`rank${d}`],a[`saj${d}Rank`],a[`${k}_rank`]];for(const v of direct)if(v!==undefined&&v!==null&&v!=='')return v;for(const g of groups){const v=g[k]??g[d];if(v!==undefined&&v!==null&&v!=='')return v}return'—'}function rankText(v){if(v==='—')return'—';return`${esc(String(v).replace(/位$/,''))}位`}function renderAthletes(){const arr=[...(db.athletes||[])].sort((a,b)=>String(a.birth||'9999').localeCompare(String(b.birth||'9999')));athletes.innerHTML=`<div class="card"><h2>選手一覧</h2>${arr.length?arr.map(a=>`<div class="athlete-item"><div class="athlete-head"><div class="title">${esc(a.name||'氏名未設定')}</div><div class="national-ranks"><span>全国ランク</span><span>SL <b>${rankText(nationalRank(a,'SL'))}</b></span><span>GS <b>${rankText(nationalRank(a,'GS'))}</b></span><span>SG <b>${rankText(nationalRank(a,'SG'))}</b></span></div></div><div class="meta">${age(a.birth)==null?'年齢—':age(a.birth)+'歳'} / SAJ No. ${esc(a.saj||'—')} / ${esc(a.school||'')}${a.grade?' '+esc(a.grade):''}</div><div class="points"><div class="point">SLポイント<b>${a.sl??'—'}</b></div><div class="point">GSポイント<b>${a.gs??'—'}</b></div><div class="point">SGポイント<b>${a.sg??'—'}</b></div></div></div>`).join(''):'<div class="empty">選手データがありません</div>'}</div>`}
function renderRace(){const today=new Date().toISOString().slice(0,10);const ev=(db.events||[]).filter(e=>(e.end||e.start||'')>=today).sort((a,b)=>String(a.start||'').localeCompare(String(b.start||'')));race.innerHTML=`<div class="card"><h2>レース速報</h2><div class="venue-actions"><a class="link" target="_blank" rel="noopener" href="https://seikosportslink.com/seiko/ssl/sportslink?a=portal&s=as">SEIKO SPORTS LINK</a><a class="link" target="_blank" rel="noopener" href="http://116.58.169.162/alge/">ALGE Live</a></div><div class="notice" style="margin-top:12px">速報サイトは外部サイトを開きます。大会ごとの速報URLが更新データに含まれる場合は、今後ここへ自動表示できます。</div>${ev.map(e=>`<div class="race-item"><div class="row"><div class="title">${esc(e.title||'大会')}</div><span class="badge">${esc(e.disc||'')}</span></div><div class="meta">${fmt(e.start)}${e.end&&e.end!==e.start?'〜'+fmt(e.end):''} / ${esc(e.place||'—')}</div></div>`).join('')||'<div class="empty">今後の大会データがありません</div>'}</div>`}
function renderAll(){renderHeader();renderAnnual();renderCompetitions();renderAthletes();renderRace()}renderAll();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
